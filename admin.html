<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Canva Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020024] text-white font-sans p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-[#00D4FF] mb-10">Admin Panel (Test Mode)</h1>
        
        <div class="bg-[#05163a] rounded-2xl border border-[#00D4FF]/20 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-900/50 text-gray-400 text-sm">
                        <th class="p-4">Name</th>
                        <th class="p-4">Phone</th>
                        <th class="p-4">TrxID</th>
                        <th class="p-4">Amount</th>
                    </tr>
                </thead>
                <tbody id="ordersList" class="text-sm">
                    <tr><td colspan="4" class="p-4 text-center">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- এখানেই ফায়ারবেস এবং এডমিন প্যানেলের সব কোড দেওয়া হলো -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyAvWIeD84boXfT4fEJaNl8HJGXEbK9SVXw",
            authDomain: "canva-access.firebaseapp.com",
            projectId: "canva-access",
            storageBucket: "canva-access.firebasestorage.app",
            messagingSenderId: "369166805582",
            appId: "1:369166805582:web:77a82e0596479c5c89711f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersList = document.getElementById("ordersList");

        async function loadOrders() {
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                ordersList.innerHTML = "";
                
                if (querySnapshot.empty) {
                    ordersList.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-yellow-500">কোনো ডাটা পাওয়া যায়নি!</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    ordersList.innerHTML += `
                        <tr class="border-b border-gray-800">
                            <td class="p-4 font-bold">${data.name || 'N/A'}</td>
                            <td class="p-4">${data.phone || 'N/A'}</td>
                            <td class="p-4 text-[#00D4FF]">${data.transactionId || 'N/A'}</td>
                            <td class="p-4 font-bold text-green-400">৳${data.amount || '0'}</td>
                        </tr>
                    `;
                });
                
                // ডাটা আসলে স্ক্রিনে মেসেজ দিবে
                alert("ডাটা সাকসেসফুলি চলে এসেছে!");
                
            } catch (error) {
                // কোনো সমস্যা থাকলে কী সমস্যা তা স্ক্রিনে দেখাবে
                alert("Error: " + error.message);
                ordersList.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">${error.message}</td></tr>`;
            }
        }

        loadOrders();
    </script>
</body>
</html>
