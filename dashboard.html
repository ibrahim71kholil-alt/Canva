<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | Canva Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020024] text-white font-sans">

    <!-- ==========================================
         কাস্টমার লগইন স্ক্রিন
         ========================================== -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-[#05163a] p-8 rounded-2xl border border-[#00D4FF]/20 text-center max-w-sm w-full shadow-2xl">
            <div class="w-16 h-16 bg-[#00D4FF]/10 text-[#00D4FF] rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                👤
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">User Dashboard</h2>
            <p class="text-gray-400 text-sm mb-8">অর্ডার করার সময় যে জিমেইল দিয়েছেন, সেটি দিয়ে লগইন করুন</p>
            
            <button id="userLoginBtn" class="w-full bg-white text-gray-900 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Login with Google
            </button>
        </div>
    </div>

    <!-- ==========================================
         লগইন করার পর কাস্টমারের ড্যাশবোর্ড
         ========================================== -->
    <div id="dashboardContent" class="hidden max-w-4xl mx-auto p-4 md:p-8">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-[#00D4FF]">My Dashboard</h1>
                <p class="text-gray-400 mt-1" id="userEmailDisplay">Loading...</p>
            </div>
            <button id="logoutBtn" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-semibold border border-gray-600 transition">
                Logout
            </button>
        </header>

        <!-- অর্ডারের স্ট্যাটাস দেখানোর জায়গা -->
        <div id="myOrdersContainer" class="grid gap-6">
            <div class="text-center p-10 bg-[#05163a] rounded-2xl border border-[#00D4FF]/20">
                <p class="text-gray-400 animate-pulse">Checking your orders...</p>
            </div>
        </div>
        
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvWIeD84boXfT4fEJaNl8HJGXEbK9SVXw",
            authDomain: "canva-access.firebaseapp.com",
            projectId: "canva-access",
            storageBucket: "canva-access.firebasestorage.app",
            messagingSenderId: "369166805582",
            appId: "1:369166805582:web:77a82e0596479c5c89711f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById("loginScreen");
        const dashboardContent = document.getElementById("dashboardContent");
        const userLoginBtn = document.getElementById("userLoginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const userEmailDisplay = document.getElementById("userEmailDisplay");
        const myOrdersContainer = document.getElementById("myOrdersContainer");

        // Authentication Check
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ইউজার লগইন করলে ড্যাশবোর্ড দেখাবে
                loginScreen.classList.add("hidden");
                dashboardContent.classList.remove("hidden");
                userEmailDisplay.innerText = user.email;
                fetchMyOrders(user.email);
            } else {
                loginScreen.classList.remove("hidden");
                dashboardContent.classList.add("hidden");
            }
        });

        userLoginBtn.addEventListener("click", async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        });

        logoutBtn.addEventListener("click", () => {
            signOut(auth);
        });

        // কাস্টমারের অর্ডার ফায়ারবেস থেকে খুঁজে বের করা
        async function fetchMyOrders(userEmail) {
            try {
                // ডাটাবেসে চেক করবে এই ইমেইল দিয়ে কোনো অর্ডার আছে কি না
                const q = query(collection(db, "orders"), where("email", "==", userEmail));
                const querySnapshot = await getDocs(q);
                
                myOrdersContainer.innerHTML = "";

                if (querySnapshot.empty) {
                    myOrdersContainer.innerHTML = `
                        <div class="bg-[#05163a] p-8 rounded-2xl border border-red-500/30 text-center">
                            <h3 class="text-xl font-bold text-red-400 mb-2">কোনো অর্ডার পাওয়া যায়নি!</h3>
                            <p class="text-gray-400 text-sm">আপনি পেমেন্ট করার সময় যে জিমেইল দিয়েছিলেন, দয়া করে সেই জিমেইল দিয়ে লগইন করুন।</p>
                        </div>
                    `;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    let statusHtml = "";
                    if(data.status === "pending") {
                        statusHtml = `
                            <div class="bg-yellow-900/20 border border-yellow-500/50 p-4 rounded-xl mt-4">
                                <p class="text-yellow-400 font-bold flex items-center gap-2">
                                    ⏳ পেমেন্ট ভেরিফাই করা হচ্ছে...
                                </p>
                                <p class="text-sm text-gray-400 mt-1">দয়া করে কিছুক্ষণ অপেক্ষা করুন। এডমিন আপনার পেমেন্ট চেক করে অ্যাপ্রুভ করলেই এখানে ক্যানভা লিংক পেয়ে যাবেন।</p>
                            </div>
                        `;
                    } else if(data.status === "approved") {
                        statusHtml = `
                            <div class="bg-green-900/20 border border-green-500/50 p-4 rounded-xl mt-4">
                                <p class="text-green-400 font-bold flex items-center gap-2 mb-2">
                                    ✅ পেমেন্ট সফল হয়েছে!
                                </p>
                                <a href="https://www.canva.com/brand/join?token=your_invite_token_here" target="_blank" class="inline-block bg-gradient-to-r from-purple-600 to-blue-500 text-white font-bold py-2 px-6 rounded-lg hover:scale-105 transition transform">
                                    Join Canva Team Now
                                </a>
                            </div>
                        `;
                    }

                    const card = `
                        <div class="bg-[#05163a] p-6 rounded-2xl border border-[#00D4FF]/20 shadow-lg relative overflow-hidden">
                            <div class="absolute top-0 right-0 bg-[#00D4FF] text-[#020024] font-bold px-3 py-1 rounded-bl-lg text-xs">
                                ${data.status.toUpperCase()}
                            </div>
                            <h3 class="text-lg font-bold text-white mb-1">Product: Canva Premium</h3>
                            <p class="text-gray-400 text-sm mb-1">Transaction ID: <span class="text-[#00D4FF] font-mono">${data.transactionId}</span></p>
                            <p class="text-gray-400 text-sm mb-4">Amount: ৳${data.amount}</p>
                            
                            ${statusHtml}
                        </div>
                    `;
                    myOrdersContainer.innerHTML += card;
                });

            } catch (error) {
                myOrdersContainer.innerHTML = `<p class="text-red-500 text-center">ডাটা লোড করতে সমস্যা হয়েছে!</p>`;
            }
        }
    </script>
</body>
</html>
